<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="admin-container">
        <h1>Admin Dashboard</h1>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="app_name">App Name</label>
                <input type="text" id="app_name" name="app_name" value="{{ app.config['APP_NAME'] }}" required>
            </div>
            <div class="form-group">
                <label for="model">AI Model</label>
                <select id="model" name="model">
                    <option value="gpt-3.5-turbo" {% if app.config['MODEL'] == 'gpt-3.5-turbo' %}selected{% endif %}>GPT-3.5 Turbo</option>
                    <option value="gpt-4" {% if app.config['MODEL'] == 'gpt-4' %}selected{% endif %}>GPT-4</option>
                </select>
            </div>
            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>
</html>
